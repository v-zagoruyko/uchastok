<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Участок</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f23; }
      canvas { display: block; }
      #bar {
        position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 12px; padding: 8px 14px;
        background: rgba(20, 24, 28, 0.78); color: #e6e8ea; border-radius: 10px;
        font: 13px/1.2 system-ui, sans-serif; backdrop-filter: blur(6px);
      }
      #bar input[type="range"] { width: min(46vw, 420px); }
      #bar .info { min-width: 190px; font-variant-numeric: tabular-nums; }
      #panel {
        position: fixed; left: 12px; top: 12px; width: 232px; max-height: calc(100vh - 88px); overflow: auto;
        padding: 10px 12px; box-sizing: border-box; background: rgba(20, 24, 28, 0.78); color: #e6e8ea;
        border-radius: 10px; font: 13px/1.3 system-ui, sans-serif; backdrop-filter: blur(6px);
      }
      #panel .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
      #panel .head #status { flex: 1; text-align: right; font-size: 12px; }
      #panel .head button { cursor: pointer; }
      #panel #status.ok { color: #8fd18f; }
      #panel #status.err { color: #ff8f8f; }
      #panel .row { display: flex; align-items: center; gap: 8px; padding: 2px 4px; border-radius: 5px; }
      #panel .row span { flex: 1; cursor: pointer; }
      #panel .row.on { background: rgba(255, 212, 0, 0.22); }
      #panel #fields { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.15); }
      #panel .name { margin-bottom: 6px; font-weight: 600; word-break: break-word; }
      #panel label.f { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
      #panel input[type="number"] { width: 84px; }
      #panel [hidden] { display: none !important; }
      #panel select { width: 132px; }
      #panel #reset-dims { width: 100%; margin-top: 2px; cursor: pointer; }
      #panel .hint { margin-top: 6px; color: #9aa3ab; font-size: 12px; }
    </style>
  </head>
  <body>
    <aside id="panel">
      <div class="head"><b>Объекты</b><span id="status"></span><button id="download" title="Скачать plot.json">⬇</button></div>
      <div id="list"></div>
      <div id="fields" hidden>
        <div class="name" id="sel-name"></div>
        <label class="f">x, м <input id="f-x" type="number" step="0.1" /></label>
        <label class="f">z, м <input id="f-z" type="number" step="0.1" /></label>
        <label class="f">поворот, ° <input id="f-rot" type="number" step="5" /></label>
        <label class="f" id="style-row" hidden>стиль <select id="f-style"></select></label>
        <div id="sizes" hidden>
          <label class="f">ширина, м <input id="f-w" type="number" step="0.1" min="0.5" /></label>
          <label class="f">длина, м <input id="f-d" type="number" step="0.1" min="0.5" /></label>
          <label class="f">высота, м <input id="f-h" type="number" step="0.1" min="0.5" /></label>
          <button id="reset-dims" hidden>Размеры стиля по умолчанию</button>
        </div>
        <label class="f" id="open-row" hidden>открыто, ° <input id="f-open" type="number" step="5" min="0" max="110" /></label>
        <div class="hint">Тащите объект мышью. Q / E: поворот на 5° (с Shift на 1°). Esc: снять выделение.</div>
      </div>
    </aside>
    <div id="bar">
      <input id="date" type="date" />
      <input id="hour" type="range" min="0" max="24" step="0.25" />
      <span id="info" class="info"></span>
      <button id="zenith" title="Солнце в зените (солнечный полдень) в выбранный день">Зенит</button>
      <button id="now" title="Текущие дата и время">Сейчас</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
